# FCC 5G Coverage-Change Audit Pipeline configuration
# Everything the pipeline needs to run a single comparison (prior vintage vs current).

# ---------------------------------------------------------------------------
# Data source backend. Switch between FCC direct download (works today) and
# Redshift (enable once your AWS access is granted). Nothing downstream changes.
# ---------------------------------------------------------------------------
source:
  backend: redshift       # "fcc" | "redshift" | "fixture"

  fcc:
    # Public (no-auth) catalog + download API used by the website itself. Requires
    # browser Referer/Origin headers or it returns 403. NO API TOKEN NEEDED - this
    # is the exact same endpoint the "Download" buttons on broadbandmap.fcc.gov call.
    base_url: "https://broadbandmap.fcc.gov/nbm/map/api"
    # Download endpoint: /getNBMDataDownloadFile/{file_id}/{file_type}. Returns a
    # ZIP containing the shapefile (file_type=1) or GeoPackage (file_type=2).
    download_url_template: "https://broadbandmap.fcc.gov/nbm/map/api/getNBMDataDownloadFile/{file_id}/{file_type}"
    # Browser-like headers required by the public catalog/download endpoints.
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
    referer: "https://broadbandmap.fcc.gov/data-download/data-by-provider"
    origin: "https://broadbandmap.fcc.gov"
    file_format: 2          # download format: 1 = ESRI Shapefile, 2 = GeoPackage
    request_timeout_s: 180
    max_retries: 5
    # FCC public data API allows ~10 requests/minute; stay under it.
    min_seconds_between_requests: 6.5

  redshift:
    # Connection (read from env / secrets, not committed).
    host: "${REDSHIFT_HOST}"
    port: 5439
    database: "${REDSHIFT_DB}"
    user: "${REDSHIFT_USER}"
    password: "${REDSHIFT_PASSWORD}"
    # The backend reads the warehouse's PRE-AGGREGATED H3 res-9 hex snapshots
    # (`<schema>.<hex_table_prefix><build>`), one row per H3 cell with a 0/1
    # coverage flag per (technology, speed tier, environment) and a comma-
    # delimited `..._prov` list of the providers covering that cell. Because H3
    # indexing is already done in the warehouse, the pipeline SKIPS polygon
    # polyfill — only the covered cell ids come back to the laptop.
    schema: "bdc_dataplatform"
    hex_table_prefix: "bbmap_mobile_bb_tech_hex9s_"
    hex_resolution: 9
    # Companion raw table (per-provider polygons) used only for provider
    # discovery when analysis.providers is "all".
    merged_table_prefix: "bbmap_mobile_bb_merged_all_"
    # FCC mobile environment code to read (0 or 1). Pick one consistently.
    environment: 0
    # Map each analysis service (by its `desc`) to the hex coverage column base;
    # the environment suffix (_env0/_env1) is appended automatically.
    service_hex_columns:
      "5G-NR (7/1 Mbps)": "tech5g_spd1"
      "5G-NR (35/3 Mbps)": "tech5g_spd2"
      "4G LTE": "tech4g"
      "3G": "tech3g"

  fixture:
    # Synthetic offline data for development / CI. See fcc_audit/fixtures.py
    dir: "data/fixtures"

# ---------------------------------------------------------------------------
# What to analyze (first build: Big-4, 5G-NR only, both speed tiers).
# ---------------------------------------------------------------------------
analysis:
  # Each service is one FCC mobile dataset, identified by its catalog
  # `technology_code_desc`. Each is its own analysis unit because the FCC selects
  # per service type (e.g. "5G 7/1"). The FCC ships each 5G speed tier as a
  # SEPARATE file. `label` is what appears in the outputs. Comment out any you
  # don't need to cut download volume (3G is being retired).
  services:
    - { label: "5G-NR 7/1",  desc: "5G-NR (7/1 Mbps)" }
    - { label: "5G-NR 35/3", desc: "5G-NR (35/3 Mbps)" }
    - { label: "4G LTE",     desc: "4G LTE" }

  # Big 4 nationwide (the FCC audit scope). Drop entries to shrink the run.
  providers:
    - { id: 130077, name: "AT&T" }
    - { id: 130403, name: "T-Mobile" }
    - { id: 131425, name: "Verizon" }
    - { id: 130235, name: "UScellular" }
  known_providers:
    - { id: 130077, name: "AT&T" }
    - { id: 130403, name: "T-Mobile" }
    - { id: 131425, name: "Verizon" }
    - { id: 130235, name: "UScellular" }

  # FCC mobile coverage files are per state. "all" pulls every state/territory;
  # or scope a first run with a FIPS list, e.g. ["48"] for Texas only.
  states: all

  # Vintages to compare. Meaning depends on the backend:
  #   fcc      -> FCC `filing_subtype` label, e.g. "December 31, 2025".
  #   redshift -> hex-snapshot BUILD id (the table-name suffix), e.g. "175".
  # Leave null to auto-pick the two most recent (for redshift this is the two
  # largest build ids, which may be only days apart — set them explicitly to
  # compare two 6-month vintages).
  vintages:
    # Redshift build ids (tech_hex9s suffix). Both are D25-vs-J25 (the FCC
    # benchmark pair). 277 and 279 are accessible today; switch current to "283"
    # (a newer D25 reprocessing) once that build's permissions land. For the `fcc`
    # backend, swap these for the filing labels ("December 31, 2025" / "June 30, 2025").
    current: "277"                 # D25 (as-of 2025-12-31); use "283" when accessible
    prior: "279"                   # J25 (as-of 2025-06-30)

# ---------------------------------------------------------------------------
# Geography / indexing
# ---------------------------------------------------------------------------
geography:
  equal_area_crs: "EPSG:5070"      # USA Contiguous Albers (for area / distance math)
  # Resolution 9 (~0.1 km^2 per hex) matches FCC broadbandmap.fcc.gov rendering
  # fidelity and gives ~7x more detail than the legacy res-8 (~0.7 km^2).
  # Use res 10 (~0.015 km^2) for maximum fidelity when compute allows — requires
  # the DuckDB rollup path (duckdb-perf) for acceptable memory at national scale.
  county_h3_resolution: 9          # FCC-map fidelity (~0.1 km^2)
  # For the Redshift backend the source hex tables are natively res-9, so keep
  # site inference at res-9 too. Setting this to 10 forces a 7x child expansion
  # (tens -> hundreds of millions of rows) with no added fidelity, which OOMs /
  # crawls at national scale. Use 10 only for the polygon (fcc) backend.
  site_h3_resolution: 9            # match the res-9 hex source (Redshift)
  # TIGER/Line county boundaries. Auto-downloaded if absent.
  counties_url: "https://www2.census.gov/geo/tiger/TIGER2024/COUNTY/tl_2024_us_county.zip"

# ---------------------------------------------------------------------------
# Tower / site inference (H3 connected components over high-signal hexes)
# ---------------------------------------------------------------------------
towers:
  # Only hexes at/above this modeled signal band seed a candidate site.
  # FCC signal bands are typically -85 / -95 / -105 dBm (higher = stronger).
  # A site is inferred per CONTIGUOUS blob of such hexes (H3 adjacency /
  # connected components, with depth peaks for flat binary coverage). One
  # tower yields one site regardless of footprint size.
  min_signal_band_dbm: -95
  # Minimum hexes in a site blob. Scale with resolution so the minimum physical
  # area is ~0.35 km^2 regardless of H3 resolution:
  #   res 8  (~0.737 km^2/hex) ->  5 hexes (~3.7 km^2)  -- legacy
  #   res 9  (~0.105 km^2/hex) -> 35 hexes (~3.7 km^2)
  #   res 10 (~0.015 km^2/hex) -> 25 hexes (~0.38 km^2)
  # Reference for site_h3_resolution 9 (~0.105 km^2/hex → ~3.7 km^2 minimum).
  # Auto-scales when the data resolution differs from site_h3_resolution.
  min_site_hexes: 35               # for site_h3_resolution 9
  # Two inferred sites within this distance (meters) across vintages are
  # treated as the same physical site (matched), else "new".
  site_match_radius_m: 2000

# ---------------------------------------------------------------------------
# Reconciliation (vector vs rendered tile) + CV fallback
# ---------------------------------------------------------------------------
reconcile:
  # Tile CV reconcile is an available helper (reconcile.py) but is NOT invoked
  # by default `run` — enabling it nationally would blow the <10h budget.
  # Boundary-snap distance below is still used during analysis.
  enabled: false
  tile_zoom: 12
  # If vector-vs-tile coverage IoU drops below this in a tile, fall back to
  # computer-vision segmentation of the rendered green map for that tile.
  min_agreement_iou: 0.80
  # Tile endpoint template (provider/tech/tier layer). Filled per provider.
  tile_url_template: "https://broadbandmap.fcc.gov/nbm/map/api/tile/{layer}/{z}/{x}/{y}.png"
  # A newly-covered hex within this distance of the county boundary counts as
  # "boundary snapping" (see scoring.boundary_snap_share).
  boundary_snap_threshold_m: 1500

# ---------------------------------------------------------------------------
# Gaming-risk scoring / prioritization
# ---------------------------------------------------------------------------
scoring:
  # A county-provider is "flagged" if its anomaly percentile is at/above this.
  flag_percentile: 0.90
  # Fraction of new coverage attributed to SAME existing sites above which the
  # same-site growth signal fires. Must ALSO be paired with an implausibility
  # gate (below) — high same-site share alone is normal 6-month growth.
  suspicious_same_site_growth: 0.50
  # Implausibility gates: at least ONE must fire alongside same_site_growth for
  # a county to be flagged via the same-site path. This prevents flagging normal
  # single-tower expansions (antenna/carrier upgrades, modest lobe growth).
  suspicious_same_site_min_county_frac: 0.15   # added_frac_of_county threshold
  suspicious_same_site_min_blanket: 0.20        # blanket_fillin threshold
  suspicious_same_site_min_unattributed: 0.20   # unattributed_share threshold
  # Magnitude gate (learned from FCC examples): a county must add at least this
  # much in-county 5G coverage to be eligible for flagging. Prevents flagging
  # near-empty counties (e.g. Edmunds, SD) or non-area-increasing signal shifts
  # (e.g. Menard, TX). At res 9/10, area math is more precise so this threshold
  # is reliable across resolutions; ~10 km^2 works for pilots and nationwide runs.
  min_added_km2_to_flag: 10.0
  # Maximum influence of any one feature is 0.25. Positive = monotonically
  # raises suspicion; negative = monotonically lowers it. Features not listed
  # are ignored. Weights encode the FCC-verified selection patterns (see
  # docs/validation_benchmark.md): PRIMARY = in-county coverage AREA increase
  # (absolute + relative); SECONDARY = rural blanket fill-in, growth not backed
  # by new towers, and boundary snapping.
  feature_weights:
    # --- PRIMARY: magnitude of in-county 5G coverage-area increase ---
    # ABSOLUTE area gained is the dominant driver. The RELATIVE jump is a minor
    # corroborator AND is itself absolute-gated in build_features() so a huge
    # percentage from a near-zero base (e.g. 0% -> 1% of county) cannot inflate
    # the score.
    added_frac_of_county: 0.25          # added covered area / county area
    coverage_increase_magnitude: 0.10   # bounded relative jump, absolute-gated
    # --- SECONDARY: implausibility / gaming signals ---
    blanket_fillin: 0.14                # low baseline -> near-complete fill (P5, rural)
    same_site_growth_share: 0.16        # growth claimed from EXISTING towers (P6)
    unattributed_share: 0.10            # coverage far from any inferred tower / flat polygons (P6)
    boundary_snap_share: 0.08           # new coverage hugging the county boundary
    # --- legitimacy (reduces suspicion) ---
    new_site_share: -0.10               # growth from genuine new towers
    # signal_jump_implausibility: 0.0   # available; off (Menard-type degradation ignored)
    # historical_volatility: 0.10       # enable once >2 vintages are processed
    # --- independent ground-truth corroboration (enable when enrichment wired) ---
    # asr_no_new_structure: 0.12        # no registered structure built in window
    # measurement_gap: 0.10             # coverage claimed but nobody measured it

# ---------------------------------------------------------------------------
# Ground-truth benchmark (from FCC J25 vs D25 5G 7/1 Mbps example slides).
# Used by `python -m fcc_audit.cli benchmark` to check the pipeline reproduces
# the FCC's own selected / not-selected decisions once real data is available.
# ---------------------------------------------------------------------------
benchmark:
  # Redshift build ids: 277 = D25 (use "283" once accessible), 279 = J25. For the
  # `fcc` backend instead use the filing labels:
  # { current: "December 31, 2025", prior: "June 30, 2025" }.
  vintages: { current: "277", prior: "279" }   # D25 vs J25
  service_label: "5G-NR 7/1"
  # Optional per-county provider_id: when set, the check looks at whether THAT
  # provider was flagged in the county; when null, any provider counts.
  # All labeled examples below are for Verizon (provider_id 131425), 5G 7/1 Mbps.
  counties:
    # --- original example slides ---
    - { geoid: "28109", name: "Pearl River County, MS", provider_id: 131425, expected_selected: true }
    - { geoid: "25017", name: "Middlesex County, MA",    provider_id: 131425, expected_selected: true }
    - { geoid: "46045", name: "Edmunds County, SD",      provider_id: 131425, expected_selected: false }
    - { geoid: "48327", name: "Menard County, TX",       provider_id: 131425, expected_selected: false }

    # --- additional Verizon 7/1 5G examples ---
    - { geoid: "36049", name: "Lewis County, NY",        provider_id: 131425, expected_selected: true }
    - { geoid: "36105", name: "Sullivan County, NY",     provider_id: 131425, expected_selected: true }
    - { geoid: "48307", name: "Mills County, TX",        provider_id: 131425, expected_selected: true }
    - { geoid: "48411", name: "San Saba County, TX",     provider_id: 131425, expected_selected: true }
    - { geoid: "48277", name: "Lamar County, TX",        provider_id: 131425, expected_selected: true }
    - { geoid: "48501", name: "Yoakum County, TX",       provider_id: 131425, expected_selected: true }
    - { geoid: "48363", name: "Palo Pinto County, TX",   provider_id: 131425, expected_selected: true }
    - { geoid: "40053", name: "Grant County, OK",        provider_id: 131425, expected_selected: true }
    - { geoid: "16071", name: "Oneida County, ID",       provider_id: 131425, expected_selected: true }
    - { geoid: "08025", name: "Crowley County, CO",      provider_id: 131425, expected_selected: false }
    - { geoid: "08105", name: "Rio Grande County, CO",   provider_id: 131425, expected_selected: false }
    - { geoid: "08021", name: "Conejos County, CO",      provider_id: 131425, expected_selected: false }

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  outputs: "data/outputs"

# ---------------------------------------------------------------------------
# Optional LLM narrative backend (default: none — deterministic only)
# ---------------------------------------------------------------------------
llm:
  backend: "none"            # none | local | gemini
  local_url: "http://localhost:11434"   # Ollama or llama.cpp server
  model: "llama3"            # model name (for local backend)
  gemini_model: "gemini-1.5-flash"     # model name (for gemini backend)
  # gemini_api_key: ""       # set here or via GEMINI_API_KEY env var
