name: Fixture Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (Python 3.9 lock)
        if: matrix.python-version == '3.9'
        run: pip install -r requirements-py39.lock.txt

      - name: Install dependencies
        if: matrix.python-version != '3.9'
        run: pip install -r requirements.txt

      - name: Run offline fixture tests
        run: |
          pytest tests/test_pipeline.py tests/test_validate.py tests/test_attribute.py \
                 tests/test_web_bundle.py tests/test_property.py \
                 tests/test_identity.py tests/test_score.py tests/test_serve.py \
                 tests/test_towers.py tests/test_groundtruth_asr.py \
                 tests/test_gaming_patterns.py tests/test_gaming_catalog.py \
            -v --tb=short -x --timeout=120 \
            --cov=fcc_audit --cov-report=term-missing --cov-fail-under=40
        env:
          PYTHONPATH: src

      - name: Tower-inference synthetic gate
        run: python scripts/eval_tower_inference.py --synthetics-only --gate
        env:
          PYTHONPATH: src

      - name: Reproduce-from-clean-clone check
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from fcc_audit import fixtures, config

          cfg = config.load_config("config/pipeline.yaml")
          fixtures.make_fixtures(cfg)
          fixture_dir = Path(cfg.project_root) / cfg.fixture["dir"]
          written = sorted(fixture_dir.glob("*/*.geojson"))
          assert written, f"make_fixtures wrote no geojson under {fixture_dir}"
          print(f"OK: {len(written)} fixture layer(s) under {fixture_dir}")
          EOF
        env:
          PYTHONPATH: src

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        # Use project ruff.toml (py39 target + ignores). Keep CI green on
        # long-standing import-order / test path-bootstrap patterns.
        run: ruff check src/ tests/ --extend-ignore I001,E402,F841,W292,E731,F541
